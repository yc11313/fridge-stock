<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冰箱庫存管理</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>冰箱庫存管理</h1>
      <div class="sub" id="today"></div>
    </div>
    <div class="hbtns">
      <button class="btn primary" id="addBtn" type="button">＋ 新增食材</button>
    </div>
  </header>

  <p class="notice" id="notice" role="status" hidden></p>

  <form id="form" hidden>
    <h2 id="formTitle">新增食材</h2>
    <label for="fName">名稱<input id="fName" required maxlength="30" placeholder="例如：雞蛋"></label>
    <label for="fCat">分類
      <select id="fCat"><option>蔬果</option><option>肉類海鮮</option><option>蛋奶</option><option>飲品</option><option>熟食剩菜</option><option>調味乾貨</option><option>其他</option></select>
    </label>
    <label for="fSpace">放在哪裡<select id="fSpace"></select></label>
    <label for="fQty">數量<input id="fQty" type="number" min="1" max="999" value="1" required></label>
    <label for="fUnit">單位<input id="fUnit" maxlength="6" value="個" required></label>
    <label for="fPrice">單價（NT$）<input id="fPrice" type="number" min="0" max="99999" step="1" value="0" required></label>
    <label for="fBuyer">購買者<select id="fBuyer"></select></label>
    <label for="fDate">到期日<input id="fDate" type="date" required></label>
    <div class="actions">
      <button class="btn primary" type="submit">儲存</button>
      <button class="btn" type="button" id="cancelBtn">取消</button>
    </div>
  </form>

  <!-- 主畫面：中間是統計，周圍的圓是各個儲存空間 -->
  <main id="home">
    <div class="orbit" id="orbit">
      <div class="ring" id="ring"></div>
      <button type="button" class="hub" id="hub" aria-label="查看全部食材">
        <span class="hub-num" id="sTotal">0</span>
        <span class="hub-label">食材總數</span>
        <span class="hub-sub"><span><b id="sSoon">0</b> 項 3 天內到期</span><span><b id="sBad">0</b> 項已過期</span></span>
      </button>
    </div>
    <div class="money-strip">
      <button type="button" class="tile" id="costBtn" aria-expanded="false" aria-controls="cost"><b id="sValue">$0</b><span>庫存價值・看成本 ▾</span></button>
      <button type="button" class="tile loss" id="lossBtn" aria-expanded="false" aria-controls="loss"><b id="sLoss">$0</b><span>過期損失・看明細 ▾</span></button>
      <button type="button" class="tile manage" id="manageBtn" aria-expanded="false" aria-controls="manage"><b>管理</b><span>空間・成員・備份</span></button>
    </div>

    <!-- 點「庫存價值」展開：各成員買進的食材成本 -->
    <section class="cost" id="cost" hidden aria-label="成員食材成本"></section>

    <!-- 點「過期損失」展開：已過期食材的損失明細 -->
    <section class="cost" id="loss" hidden aria-label="過期損失明細"></section>

    <!-- 點「管理」展開：儲存空間、家庭成員、資料備份 -->
    <section class="panel" id="manage" hidden aria-label="管理">
      <div class="seg" role="tablist" aria-label="管理項目">
        <button type="button" role="tab" class="seg-btn" data-tab="spaces" aria-selected="true">儲存空間</button>
        <button type="button" role="tab" class="seg-btn" data-tab="members" aria-selected="false">家庭成員</button>
        <button type="button" role="tab" class="seg-btn" data-tab="backup" aria-selected="false">資料備份</button>
      </div>

      <div class="pane" data-pane="spaces">
        <p class="hint">例如：廚房冰箱、車庫冷凍櫃、儲藏室。示範版只能新增，不能修改或刪除。</p>
        <div class="stack" id="spaceList"></div>
        <div class="edit-row"><input id="newSpace" maxlength="12" placeholder="新增儲存空間名稱" aria-label="新儲存空間名稱"><button class="btn primary" id="addSpace" type="button">新增</button></div>
      </div>

      <div class="pane" data-pane="members" hidden>
        <p class="hint">成員可以被指定為食材的購買者。示範版只能新增，不能修改或刪除。</p>
        <div class="stack" id="memberList"></div>
        <div class="edit-row"><input id="newMember" maxlength="10" placeholder="新增成員名稱" aria-label="新成員名稱"><button class="btn primary" id="addMember" type="button">新增</button></div>
      </div>

      <div class="pane" data-pane="backup" hidden>
        <p class="hint">資料存在雲端資料庫，任何裝置打開都是同一份。可以下載一份 JSON 備份檔。</p>
        <div class="btns">
          <button class="btn" id="exportBtn" type="button">下載備份（JSON）</button>
        </div>
        <p class="hint" id="backupMsg" role="status"></p>
      </div>

      <div class="actions"><button class="btn" id="closeManage" type="button">完成</button></div>
    </section>

    <p class="hint center">點圓圈看該空間的食材，點中間看全部。</p>
  </main>

  <!-- 某個儲存空間裡的食材 -->
  <section id="detail" hidden>
    <div class="d-head">
      <button class="btn" id="backBtn" type="button">← 返回</button>
      <div class="d-title">
        <h2 id="dTitle"></h2>
        <div class="sub" id="dMeta"></div>
      </div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="搜尋食材或分類" aria-label="搜尋食材">
      <select id="memberFilter" aria-label="依購買者篩選"></select>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <footer>資料存在 Supabase 雲端資料庫，任何人打開看到的都是同一份。示範版只開放讀取與新增。成本 = 單價 × 數量。</footer>
</div>

<!-- 連線到 Supabase：網址與 Publishable key 是公開用的，可以放在網頁裡。管理員等級的祕密金鑰絕對不要放進網頁。 -->

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  window.supabaseClient = createClient(
    'https://aucnanynfzsbzffbqemh.supabase.co',
    'sb_publishable_yqkci-NFbPcfVczbnEhYpA_TKJ3TgeL'
  );
  // 連線準備好之後才載入主程式
  const app = document.createElement('script');
  app.src = 'app.js';
  document.body.appendChild(app);
</script>
</body>
</html>
